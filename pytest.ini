[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers --html=reports/report.html --self-contained-html
    --cov --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage
markers =
    valid: happy-path tests with valid input data
    invalid: tests with invalid or inopportune input data
    unit: offline unit tests for the project's own code
